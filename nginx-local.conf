map $http_srforgid $plm_srforgid {
    default $http_srforgid;
}

map $http_srfuserid $plm_srfuserid {
    default $http_srfuserid;
    ""      aibizhi;
}

map $http_srfusername $plm_srfusername {
    default $http_srfusername;
    ""      aibizhi;
}

map $http_srforgcode $plm_srforgcode {
    default $http_srforgcode;
    ""      000000;
}

server {
    listen 8080;
    server_name localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $uaa_upstream http://ibizlab-uaa-api:32666;
    set $allinone_upstream http://ibiz-ebsx-allinone:30000;
    set $gateway_upstream http://ibiz-ebsx-gateway:30086;
    set $plm_upstream http://plmservice:30251;

    location = /assets/images/login-header.png {
        alias /dist/assets/images/login-header.png;
    }

    location = /assets/images/login-avatar.png {
        alias /dist/assets/images/login-avatar.png;
    }

    location = /ibizplm-plmweb {
        return 302 /ibizplm-plmweb/$is_args$args;
    }

    location ^~ /ibizplm-plmweb/ {
        alias /dist/;
        index index.html;
    }

    location = /api/ibizplm__plmweb/appdata {
        rewrite ^ /appdata break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/v7/ {
        rewrite ^/api/ibizplm__plmweb/v7/(.*)$ /v7/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ibizplm__plmweb/uaa/ {
        rewrite ^/api/ibizplm__plmweb/uaa/(.*)$ /uaa/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ibizplm__plmweb/extension/internal_messages/ {
        rewrite ^/api/ibizplm__plmweb/extension/internal_messages/(.*)$ /extension/api/internal_messages/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location = /api/ibizplm__plmweb/extension/app_view_themes {
        rewrite ^ /extension/api/app_view_themes break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/extension/app_view_themes/ {
        rewrite ^/api/ibizplm__plmweb/extension/app_view_themes/(.*)$ /extension/api/app_view_themes/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/configs/customtheme/ {
        rewrite ^/api/ibizplm__plmweb/(configs/.*)$ /$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/configs/menu/ {
        rewrite ^/api/ibizplm__plmweb/(configs/.*)$ /$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/configs/dynafilter/ {
        rewrite ^/api/ibizplm__plmweb/(configs/.*)$ /$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/dictionaries/ {
        # The gateway selects application state machines before shared dictionaries.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
        proxy_set_header srfuserid $plm_srfuserid;
        proxy_set_header srfusername $plm_srfusername;
        proxy_set_header srforgcode $plm_srforgcode;
    }

    location = /api/ibizplm__plmweb/portal/mqtt/mqtt {
        proxy_pass http://emqx:8085/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /api/ibizplm__plmweb/portal/ {
        rewrite ^/api/ibizplm__plmweb/(portal/.*)$ /$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
        proxy_set_header srfuserid $plm_srfuserid;
        proxy_set_header srfusername $plm_srfusername;
        proxy_set_header srforgcode $plm_srforgcode;
    }

    location ^~ /api/ibizplm__plmweb/jsonschema/ {
        rewrite ^/api/ibizplm__plmweb/jsonschema/([A-Za-z0-9_]+)$ /PSSYSAPPS/plmweb/PSAPPDATAENTITIES/$1.jsonschema break;
        root /app/model;
        try_files $uri =404;
        default_type application/schema+json;
        add_header Cache-Control no-store;
    }

    location ^~ /api/ibizplm__plmweb/ {
        rewrite ^/api/ibizplm__plmweb/(.*)$ /ibizservicerunner/serviceapi/$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header srfsystemid ibizplm;
        proxy_set_header srforgid $plm_srforgid;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
